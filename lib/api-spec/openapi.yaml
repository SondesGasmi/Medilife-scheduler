openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: staff
    description: Medical staff management
  - name: acts
    description: Diagnostic acts catalogue
  - name: schedule
    description: Staff schedule management
  - name: act-logs
    description: Performed diagnostic acts
  - name: remuneration
    description: Remuneration summaries
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /staff:
    get:
      operationId: listStaff
      tags: [staff]
      summary: List staff members
      responses:
        "200":
          description: Staff members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Staff"
    post:
      operationId: createStaff
      tags: [staff]
      summary: Create a staff member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffInput"
      responses:
        "201":
          description: Created staff member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Staff"
        "400":
          description: Invalid staff data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /staff/summary:
    get:
      operationId: getStaffSummary
      tags: [staff]
      summary: Get staff summary
      responses:
        "200":
          description: Staff summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffSummary"
  /staff/{id}:
    patch:
      operationId: updateStaff
      tags: [staff]
      summary: Update a staff member
      parameters:
        - $ref: "#/components/parameters/StaffId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffUpdate"
      responses:
        "200":
          description: Updated staff member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Staff"
        "400":
          description: Invalid staff data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Staff member not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteStaff
      tags: [staff]
      summary: Delete a staff member
      parameters:
        - $ref: "#/components/parameters/StaffId"
      responses:
        "204":
          description: Staff member deleted
        "404":
          description: Staff member not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /acts:
    get:
      operationId: listActs
      tags: [acts]
      summary: List diagnostic acts
      responses:
        "200":
          description: Active diagnostic acts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Act"
  /schedule-slots:
    get:
      operationId: listScheduleSlots
      tags: [schedule]
      summary: List schedule slots in a date range
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Schedule slots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScheduleSlot"
    post:
      operationId: createScheduleSlot
      tags: [schedule]
      summary: Create a schedule slot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleSlotInput"
      responses:
        "201":
          description: Created schedule slot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleSlot"
        "409":
          description: Schedule conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /schedule-slots/generate:
    post:
      operationId: generateSchedule
      tags: [schedule]
      summary: Generate schedule slots
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleGenerationInput"
      responses:
        "200":
          description: Generated schedule slots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScheduleSlot"
  /schedule-slots/{id}:
    patch:
      operationId: updateScheduleSlot
      tags: [schedule]
      summary: Update a schedule slot
      parameters:
        - $ref: "#/components/parameters/ScheduleSlotId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleSlotUpdate"
      responses:
        "200":
          description: Updated schedule slot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleSlot"
        "409":
          description: Locked or conflicting schedule slot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteScheduleSlot
      tags: [schedule]
      summary: Delete a schedule slot
      parameters:
        - $ref: "#/components/parameters/ScheduleSlotId"
      responses:
        "204":
          description: Schedule slot deleted
  /act-logs:
    get:
      operationId: listActLogs
      tags: [act-logs]
      summary: List performed diagnostic acts
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - name: staff_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Performed acts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActLog"
    post:
      operationId: createActLog
      tags: [act-logs]
      summary: Record a performed diagnostic act
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActLogInput"
      responses:
        "201":
          description: Created act log
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActLog"
  /act-logs/{id}:
    patch:
      operationId: updateActLog
      tags: [act-logs]
      summary: Update a performed diagnostic act
      parameters:
        - $ref: "#/components/parameters/ActLogId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActLogUpdate"
      responses:
        "200":
          description: Updated act log
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActLog"
    delete:
      operationId: deleteActLog
      tags: [act-logs]
      summary: Delete a performed diagnostic act
      parameters:
        - $ref: "#/components/parameters/ActLogId"
      responses:
        "204":
          description: Act log deleted
  /remuneration:
    get:
      operationId: listRemuneration
      tags: [remuneration]
      summary: List monthly remuneration summaries
      responses:
        "200":
          description: Monthly remuneration summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RemunerationSummary"
components:
  parameters:
    StaffId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ScheduleSlotId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ActLogId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Staff:
      type: object
      properties:
        id:
          type: string
          format: uuid
        full_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: ["string", "null"]
        role:
          $ref: "#/components/schemas/StaffRole"
        contract_type:
          $ref: "#/components/schemas/ContractType"
        specialities:
          type: array
          items:
            type: string
        scheduling_constraints:
          type: object
          additionalProperties: true
        max_shifts_per_week:
          type: integer
          minimum: 1
        max_gardes_per_month:
          type: ["integer", "null"]
          minimum: 0
        is_active:
          type: boolean
        hire_date:
          type: ["string", "null"]
          format: date
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - full_name
        - email
        - phone
        - role
        - contract_type
        - specialities
        - scheduling_constraints
        - max_shifts_per_week
        - max_gardes_per_month
        - is_active
        - hire_date
        - created_at
        - updated_at
    StaffInput:
      type: object
      properties:
        full_name:
          type: string
          minLength: 2
        email:
          type: string
          format: email
        phone:
          type: ["string", "null"]
        role:
          $ref: "#/components/schemas/StaffRole"
        contract_type:
          $ref: "#/components/schemas/ContractType"
        specialities:
          type: array
          items:
            type: string
        scheduling_constraints:
          type: object
          additionalProperties: true
        max_shifts_per_week:
          type: integer
          minimum: 1
          maximum: 14
        max_gardes_per_month:
          type: ["integer", "null"]
          minimum: 0
        is_active:
          type: boolean
        hire_date:
          type: ["string", "null"]
      required:
        - full_name
        - email
        - role
        - contract_type
        - max_shifts_per_week
    StaffUpdate:
      type: object
      properties:
        full_name:
          type: string
          minLength: 2
        email:
          type: string
          format: email
        phone:
          type: ["string", "null"]
        role:
          $ref: "#/components/schemas/StaffRole"
        contract_type:
          $ref: "#/components/schemas/ContractType"
        specialities:
          type: array
          items:
            type: string
        scheduling_constraints:
          type: object
          additionalProperties: true
        max_shifts_per_week:
          type: integer
          minimum: 1
          maximum: 14
        max_gardes_per_month:
          type: ["integer", "null"]
          minimum: 0
        is_active:
          type: boolean
        hire_date:
          type: ["string", "null"]
          format: date
    StaffSummary:
      type: object
      properties:
        total:
          type: integer
        active:
          type: integer
        radiologists:
          type: integer
        available_slots:
          type: integer
      required:
        - total
        - active
        - radiologists
        - available_slots
    StaffRole:
      type: string
      enum:
        - radiologue
        - medecin
        - manipulateur_radio
        - technicien
        - secretaire
        - administrateur
    ContractType:
      type: string
      enum:
        - cdi
        - temps_partiel
        - vacataire
        - stagiaire
    Act:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name_fr:
          type: string
        category:
          type: string
        base_price:
          type: number
          minimum: 0
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, code, name_fr, category, base_price, is_active, created_at, updated_at]
    ShiftType:
      type: string
      enum: [matin, apres_midi, journee_complete, garde_jour, garde_nuit, repos]
    SlotStatus:
      type: string
      enum: [planifie, confirme, annule, remplace]
    ScheduleSlot:
      type: object
      properties:
        id:
          type: string
          format: uuid
        staff_id:
          type: ["string", "null"]
          format: uuid
        shift_date:
          type: string
          format: date
        shift_type:
          $ref: "#/components/schemas/ShiftType"
        status:
          $ref: "#/components/schemas/SlotStatus"
        is_locked:
          type: boolean
        locked_by:
          type: ["string", "null"]
          format: uuid
        locked_at:
          type: ["string", "null"]
          format: date-time
        notes:
          type: ["string", "null"]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, staff_id, shift_date, shift_type, status, is_locked, locked_by, locked_at, notes, created_at, updated_at]
    ScheduleSlotInput:
      type: object
      properties:
        staff_id:
          type: ["string", "null"]
          format: uuid
        shift_date:
          type: string
          format: date
        shift_type:
          $ref: "#/components/schemas/ShiftType"
        status:
          $ref: "#/components/schemas/SlotStatus"
        is_locked:
          type: boolean
        notes:
          type: ["string", "null"]
      required: [shift_date, shift_type]
    ScheduleSlotUpdate:
      type: object
      properties:
        staff_id:
          type: ["string", "null"]
          format: uuid
        shift_date:
          type: string
          format: date
        shift_type:
          $ref: "#/components/schemas/ShiftType"
        status:
          $ref: "#/components/schemas/SlotStatus"
        is_locked:
          type: boolean
        notes:
          type: ["string", "null"]
    ScheduleGenerationInput:
      type: object
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        full_reset:
          type: boolean
      required: [from, to]
    ActLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
        staff_id:
          type: string
          format: uuid
        act_id:
          type: string
          format: uuid
        schedule_slot_id:
          type: ["string", "null"]
          format: uuid
        performed_at:
          type: string
          format: date
        quantity:
          type: integer
          minimum: 1
        unit_price:
          type: number
          minimum: 0
        total_amount:
          type: number
          minimum: 0
        entered_by:
          type: ["string", "null"]
          format: uuid
        notes:
          type: ["string", "null"]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, staff_id, act_id, schedule_slot_id, performed_at, quantity, unit_price, total_amount, entered_by, notes, created_at, updated_at]
    ActLogInput:
      type: object
      properties:
        staff_id:
          type: string
          format: uuid
        act_id:
          type: string
          format: uuid
        schedule_slot_id:
          type: ["string", "null"]
          format: uuid
        performed_at:
          type: string
          format: date
        quantity:
          type: integer
          minimum: 1
        entered_by:
          type: ["string", "null"]
          format: uuid
        notes:
          type: ["string", "null"]
      required: [staff_id, act_id, performed_at, quantity]
    ActLogUpdate:
      type: object
      properties:
        staff_id:
          type: string
          format: uuid
        act_id:
          type: string
          format: uuid
        schedule_slot_id:
          type: ["string", "null"]
          format: uuid
        performed_at:
          type: string
          format: date
        quantity:
          type: integer
          minimum: 1
        notes:
          type: ["string", "null"]
    RemunerationSummary:
      type: object
      properties:
        staff_id:
          type: string
          format: uuid
        full_name:
          type: string
        month:
          type: string
          format: date
        acts_count:
          type: integer
        total_remuneration:
          type: number
      required: [staff_id, full_name, month, acts_count, total_remuneration]
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

